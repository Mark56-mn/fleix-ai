<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fleix · Autonomous Console</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        font-family: Inter, system-ui, sans-serif;
        margin: 0;
        background: radial-gradient(circle at top, #121b48 0%, #050b22 58%, #030717 100%);
        color: #e8ecff;
      }
      .app { max-width: 980px; margin: 0 auto; padding: 20px 14px 24px; min-height: 100vh; display: flex; flex-direction: column; }
      .head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.1rem); }
      .sub { color: #9fb0ff; margin-top: 6px; }
      .badge { border: 1px solid #2d3e89; color: #c8d3ff; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
      .chat {
        margin-top: 14px;
        background: #101a43cc;
        border: 1px solid #2d3d85;
        border-radius: 16px;
        min-height: 64vh;
        max-height: 64vh;
        overflow: auto;
        padding: 14px;
      }
      .row { margin: 10px 0; line-height: 1.45; white-space: pre-wrap; }
      .user { color: #9ec5ff; }
      .bot { color: #cbfce2; }
      .meta { color: #8ca0f6; font-size: 12px; }
      .err { color: #ffc9d1; }
      form { margin-top: 12px; display: flex; gap: 8px; }
      input {
        flex: 1;
        border-radius: 12px;
        border: 1px solid #36508f;
        background: #0a1438;
        color: #e2e8f0;
        padding: 12px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 0 18px;
        background: linear-gradient(135deg, #6366f1, #7c3aed);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.65; cursor: wait; }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="head">
        <div>
          <h1>fleix · Autonomous Learning System</h1>
          <div class="sub">Creator: Mr Gray · Purpose: autonomous learning system</div>
        </div>
        <div class="badge" id="status">Ready</div>
      </header>

      <section id="chat" class="chat"></section>

      <form id="form">
        <input id="input" placeholder="Ask fleix anything..." required />
        <button id="send" type="submit">Send</button>
      </form>
    </main>

    <script>
      const chat = document.getElementById('chat');
      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const send = document.getElementById('send');
      const status = document.getElementById('status');

      const append = (text, cls = '') => {
        const div = document.createElement('div');
        div.className = `row ${cls}`.trim();
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
      };

      const setStatus = (text) => { status.textContent = text; };

      const callChat = async (query) => {
        const endpoints = ['/chat', '/api/chat'];
        let lastErr = null;

        for (const endpoint of endpoints) {
          try {
            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ query })
            });

            if (!res.ok) {
              const body = await res.text().catch(() => '');
              throw new Error(`${endpoint} failed (${res.status}) ${body.slice(0, 180)}`);
            }
            return res;
          } catch (error) {
            lastErr = error;
          }
        }

        throw lastErr ?? new Error('No chat endpoint available');
      };

      append('fleix: System online. I will try memory and local reasoning first.', 'meta');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;
        append(`You: ${query}`, 'user');
        input.value = '';
        send.disabled = true;
        setStatus('Thinking...');

        const botNode = append('fleix: ', 'bot');

        try {
          const res = await callChat(query);
          if (!res.body) {
            botNode.textContent += '\n[No stream available]';
            return;
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            botNode.textContent += decoder.decode(value, { stream: true });
            chat.scrollTop = chat.scrollHeight;
          }
        } catch (error) {
          botNode.classList.add('err');
          botNode.textContent += `\nRequest failed. ${error instanceof Error ? error.message : String(error)}`;
        } finally {
          send.disabled = false;
          setStatus('Ready');
        }
      });
    </script>
  </body>
</html>
